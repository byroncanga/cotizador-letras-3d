name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate EasyPanel Compose stack
        run: docker compose config --quiet
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://cotizador.example.com
          TALLER_DB_PASSWORD: ci-test-password
          TALLER_DB_ROOT_PASSWORD: ci-test-root-password
      - name: Build all EasyPanel services
        run: docker compose build
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://cotizador.example.com
          TALLER_DB_PASSWORD: ci-test-password
          TALLER_DB_ROOT_PASSWORD: ci-test-root-password
